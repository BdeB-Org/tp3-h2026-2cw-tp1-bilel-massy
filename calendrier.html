<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier des Entraînements - Système de Gestion du Gym</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">🏋️ Gym Management System</a>
            <div class="d-flex">
                <a href="membres.html" class="btn btn-outline-light btn-sm me-2">Membres</a>
                <a href="entraineurs.html" class="btn btn-outline-light btn-sm me-2">Entraîneurs</a>
                <a href="calendrier.html" class="btn btn-primary btn-sm">Calendrier</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="container mb-5">
        <div class="card shadow p-4 bg-white rounded-3 mb-4">
            <h2 class="h5 mb-3 text-secondary">📅 Planifier un nouvel entraînement</h2>
            <form id="form-ajouter-entrainement">
                <div class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">ID Unique</label>
                        <input type="number" id="entrainement-id" class="form-control form-control-sm" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">Jour</label>
                        <select id="entrainement-jour" class="form-select form-select-sm" required>
                            <option value="Lundi">Lundi</option>
                            <option value="Mardi">Mardi</option>
                            <option value="Mercredi">Mercredi</option>
                            <option value="Jeudi">Jeudi</option>
                            <option value="Vendredi">Vendredi</option>
                            <option value="Samedi">Samedi</option>
                            <option value="Dimanche">Dimanche</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">Début</label>
                        <input type="text" id="entrainement-debut" class="form-control form-control-sm" placeholder="Ex: 17h00" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">Fin</label>
                        <input type="text" id="entrainement-fin" class="form-control form-control-sm" placeholder="Ex: 18h30" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">ID Entraîneur</label>
                        <input type="number" id="entrainement-coach" class="form-control form-control-sm" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">Activité</label>
                        <input type="text" id="entrainement-activite" class="form-control form-control-sm" placeholder="Ex: Boxe" required>
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-primary btn-sm px-4">Ajouter au calendrier</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="card shadow p-4 bg-white rounded-3">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="text-primary font-weight-bold h3 mb-1">📅 Horaires & Disponibilités</h1>
                    <p class="text-muted mb-0">Vue d'ensemble des jours occupés par les entraîneurs et des créneaux libres.</p>
                </div>
                <span class="badge bg-secondary p-2" id="current-week">Semaine de Travail</span>
            </div>
            <div class="row row-cols-1 row-cols-md-7 g-2" id="calendrier-grille">
                <!-- Les jours du calendrier seront générés ici par JavaScript -->
            </div>
        </div>
    </div>
    <script src="js/api.js"></script> 
    <script src="js/calendrier.js"></script>
</body>
</html>
