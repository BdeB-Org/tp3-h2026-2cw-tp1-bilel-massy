<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Membres - Gym</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 text-center text-primary">Gestion des Membres</h1>
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm p-4">
                    <h3 class="h5 mb-3 text-secondary">Inscrire un Membre</h3>
                    <form id="form-ajouter-membre">
                        <div class="mb-3">
                            <label class="form-label">ID Membre (Unique)</label>
                            <input type="number" id="membre-id" class="form-control" placeholder="Ex: 3" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nom Complet</label>
                            <input type="text" id="membre-nom" class="form-control" placeholder="Jean Tremblay" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Courriel</label>
                            <input type="email" id="membre-courriel" class="form-control" placeholder="jean@gmail.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Téléphone</label>
                            <input type="text" id="membre-telephone" class="form-control" placeholder="514-555-0100" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Ajouter</button>
                    </form>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm p-4">
                    <h3 class="h5 mb-3 text-secondary">Liste des Membres Actuels</h3>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Nom</th>
                                    <th>Courriel</th>
                                    <th>Téléphone</th>
                                </tr>
                            </thead>
                            <tbody id="liste-membres"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/membres.js"></script>
</body>
</html>
